# --- JVM / Gradle ---
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Android ---
android.useAndroidX=true
# KSP（Room 注解处理）通过 kotlin.sourceSets 注册生成目录，AGP 9 的内置 Kotlin
# 默认禁止这种写法（报 "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed
# with built-in Kotlin"）。这里按官方提示关闭该限制；KSP 与 Room 的兼容性有实测记录，
# 见 docs/技术栈.md 与骨架与 UI 阶段报告。除 KSP 外没有任何地方使用 kotlin.sourceSets。
android.disallowKotlinSourceSets=false
android.nonTransitiveRClass=true
