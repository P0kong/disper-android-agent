# 单一事实来源：所有依赖与插件版本都在这里声明。
[versions]
agp = "9.2.1"
chaquopy = "17.0.0"
# AGP 9.2.1 内置的 Kotlin (KGP) 版本，实测 buildEnvironment = 2.2.10。
# Compose 编译器插件必须与 KGP 严格同版本。
kotlin = "2.2.10"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
# Room 2.8.5 / KSP 2.2.10-2.0.2：KSP 版本前缀必须等于 Kotlin 版本（AGP 9 内置 KGP 2.2.10）。
room = "2.8.5"
ksp = "2.2.10-2.0.2"
# JVM 单元测试依赖。Robolectric 未引入（需要额外下载 android-all 运行时，见 docs/ARCHITECTURE.md）。
junit = "4.13.2"
coroutinesTest = "1.10.2"
# Instrumentation-only migration validation; no production dependency upgrade.
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
uiautomator = "2.4.0"
# --- P2-B：真实 HTTP/SSE 传输层依赖（引入前已核 POM 许可证与 Kotlin 兼容性） ---
# OkHttp 5.5.0：POM <licenses> = Apache-2.0；依赖 kotlin-stdlib 2.1.21 + okio 3.18.1。
# mockwebserver3 与 okhttp 同版本，仅 testImplementation。
okhttp = "5.5.0"
# kotlinx-serialization-json 1.9.0：POM <licenses> = Apache-2.0，要求 kotlin-stdlib >= 2.2.0（基线 2.2.10 满足）；
# 1.10.0 起要求 stdlib 2.3.0，超出当前基线，故固定在 1.9.0。
# 只使用运行时的 JsonElement API（Json.parseToJsonElement），不应用 serialization 编译器插件，
# 以免重蹈 KSP × AGP 9 内置 Kotlin 的插件冲突（见 docs/技术栈.md §9）。
kotlinxSerialization = "1.9.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
